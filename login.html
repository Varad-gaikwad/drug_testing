<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Officer Login | Field Forensic Screening Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-md p-8 w-full max-w-sm space-y-4">
    <h1 class="text-xl font-black text-center">Officer Login</h1>
    <p class="text-xs text-center text-slate-500">Demo authentication — not for operational use</p>

    <input id="officerId" placeholder="Officer ID" class="w-full border rounded-lg px-3 py-2 text-sm">
    <input id="password" type="password" placeholder="Password" class="w-full border rounded-lg px-3 py-2 text-sm">

    <button onclick="login()" class="w-full bg-blue-900 text-white py-2.5 rounded-lg font-bold text-sm">Log in</button>
    <button onclick="signup()" class="w-full border py-2.5 rounded-lg font-bold text-sm">Create account</button>

    <div id="authOut" class="text-xs text-center text-red-600"></div>
  </div>

<script>
const BACKEND = "http://127.0.0.1:8000"; // match your actual Flask port

async function login() {
  const officer_id = document.getElementById('officerId').value.trim();
  const password = document.getElementById('password').value;
  const out = document.getElementById('authOut');

  if (!officer_id || !password) {
    out.innerText = "Enter both fields.";
    return;
  }

  try {
    const res = await fetch(`${BACKEND}/login`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ officer_id, password })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem("officer_id", officer_id);
      window.location.href = "frontend.html";
    } else {
      out.innerText = data.error;
    }
  } catch (err) {
    out.innerText = "Could not reach server.";
  }
}

async function signup() {
  const officer_id = document.getElementById('officerId').value.trim();
  const password = document.getElementById('password').value;
  const out = document.getElementById('authOut');

  if (!officer_id || !password) {
    out.innerText = "Enter both fields.";
    return;
  }

  try {
    const res = await fetch(`${BACKEND}/signup`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ officer_id, password })
    });
    const data = await res.json();
    out.className = res.ok ? "text-xs text-center text-emerald-600" : "text-xs text-center text-red-600";
    out.innerText = res.ok ? "Account created — now log in." : data.error;
  } catch (err) {
    out.innerText = "Could not reach server.";
  }
}
</script>
</body>
</html>
